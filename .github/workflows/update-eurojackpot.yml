name: Eurojackpot-Zahlen aktualisieren

# GitHub startet geplante Läufe oft verspätet (teils Stunden) oder lässt einzelne aus.
# Deshalb viele Versuche rund um die Ziehung. Ist die CSV schon aktuell, beendet sich
# das Skript nach wenigen Sekunden, ohne eine Quelle abzufragen.
on:
  schedule:
    # Zeiten in UTC. Ziehung Di + Fr ca. 20–21 Uhr deutscher Zeit.
    - cron: "7,27,47 20-23 * * 2,5"   # Di/Fr abends alle 20 Minuten
    - cron: "17,47 0-7 * * 3,6"       # Mi/Sa nachts und morgens alle 30 Minuten
    - cron: "37 11 * * *"             # täglich als Sicherheitsnetz
  workflow_dispatch:                   # manuell: prüft immer alle Quellen

permissions:
  contents: write

concurrency:
  group: update-eurojackpot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Neue Ziehungen holen
        run: python scripts/update_eurojackpot.py

      - name: Commit, falls sich etwas geändert hat
        run: |
          if git diff --quiet -- data/eurojackpot.csv; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eurojackpot.csv
          git commit -m "Eurojackpot: $(tail -n1 data/eurojackpot.csv | cut -d, -f1)"
          git push
