name: Eurojackpot-Zahlen aktualisieren

on:
  schedule:
    # Ziehung Di + Fr ca. 21 Uhr deutscher Zeit. Zeiten in UTC.
    - cron: "40 21 * * 2,5"   # Di/Fr spätabends
    - cron: "17 5 * * 3,6"    # Mi/Sa früh (Nachzügler, zweite Quelle)
    - cron: "17 16 * * 3,6"   # Mi/Sa nachmittags
  workflow_dispatch:           # manuell über den Actions-Tab

permissions:
  contents: write

concurrency:
  group: update-eurojackpot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Neue Ziehungen holen
        run: python scripts/update_eurojackpot.py

      - name: Commit, falls sich etwas geändert hat
        run: |
          if git diff --quiet -- data/eurojackpot.csv; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eurojackpot.csv
          git commit -m "Eurojackpot: $(tail -n1 data/eurojackpot.csv | cut -d, -f1)"
          git push
